# gitleaks: default rules, plus an allowlist for the synthetic test fixtures, which
# contain fake keys on purpose (they test secret masking).
[extend]
useDefault = true

[allowlist]
description = "synthetic fixtures, their snapshots, and the empty-valued .env example"
paths = [
    '''^fixtures/''',
    '''^crates/sudare-core/tests/snapshots/''',
    '''^crates/sudare-core/src/extract\.rs$''',
    '''^deploy/\.env\.example$''',  # empty KEY= placeholders; the generic-api-key rule matches across lines
]
