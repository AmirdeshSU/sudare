# docker compose -f deploy/docker-compose.yml up -d            # Sudare only
# docker compose -f deploy/docker-compose.yml --profile ollama up -d   # plus a local model
#
# Needs SUDARE_SECRET_KEY (run `sudare keygen`), e.g. in deploy/.env (never commit it).
# The single-user login link is printed in `docker compose logs sudare`.
services:
  sudare:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: sudare:local
    restart: unless-stopped
    # Loopback only. Put a TLS reverse proxy in front before exposing it anywhere else,
    # and set SUDARE_ALLOWED_HOSTS and SUDARE_COOKIE_SECURE=true there.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SUDARE_SECRET_KEY: ${SUDARE_SECRET_KEY:?set SUDARE_SECRET_KEY (run sudare keygen)}
      SUDARE_MODE: ${SUDARE_MODE:-single}
      SUDARE_TOKEN: ${SUDARE_TOKEN:-}
      SUDARE_ADMIN_PASSWORD: ${SUDARE_ADMIN_PASSWORD:-}
      SUDARE_RETENTION_DAYS: ${SUDARE_RETENTION_DAYS:-30}
      SUDARE_OLLAMA_URL: http://ollama:11434
      SUDARE_LOCAL_HOSTS: ollama
    volumes:
      - sudare-data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  ollama:
    image: ollama/ollama:0.40.13
    profiles: ["ollama"]
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    # Not published to the host: only Sudare talks to it.

volumes:
  sudare-data:
  ollama-models:
