[workspace]
resolver = "3"
members = [
    "crates/sudare-core",
    "crates/sudare-egress",
    "crates/sudare-server",
    "crates/sudare-cli",
    "crates/sudare-py",
    "crates/sudare-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"
authors = ["Sudare contributors"]

[workspace.dependencies]
sudare-core = { path = "crates/sudare-core", version = "0.1.0" }
sudare-egress = { path = "crates/sudare-egress", version = "0.1.0" }
sudare-server = { path = "crates/sudare-server", version = "0.1.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "macros", "time", "sync"] }
async-trait = "0.1.92"
getrandom = "0.4.3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
