[package]
name = "sudare-wasm"
description = "Sudare masking compiled to WebAssembly for the in-browser playground. Nothing leaves the page."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# By path, not `workspace = true`: older cargo (cargo-deny's) rejects default-features
# overrides on inherited dependencies.
sudare-core = { path = "../sudare-core", version = "0.1.0", default-features = false }
serde_json.workspace = true
wasm-bindgen = "0.2.130"
