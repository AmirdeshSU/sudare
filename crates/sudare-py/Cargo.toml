[package]
name = "sudare-py"
description = "Python bindings for sudare-core (mask / unmask)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
publish = false

[lib]
name = "sudare"
