[package]
name = "sudare-core"
description = "Parse, extract, classify and reversibly mask security logs for LLM analysis. No network access."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true

[features]
default = ["evtx"]
# Native .evtx files. Off for wasm32 builds.
evtx = ["dep:evtx"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml = "1.1.8"
regex = "1.13.1"
aho-corasick = "1.1.5"
unicode-normalization = "0.1.26"
ipnet = { version = "2.12.2", features = ["serde"] }
url = "2.5.8"
hmac = "0.13.0"
sha2 = "0.11.1"
schemars = "1.2.3"
indexmap = { version = "2.14.2", features = ["serde"] }
zeroize = "1.9.1"
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }
evtx = { version = "0.15.1", default-features = false, optional = true }

[dev-dependencies]
proptest = "1.12.0"
insta = { version = "1.49.0", features = ["yaml"] }
