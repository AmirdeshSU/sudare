name: release

# On-prem artefacts.
# - Every push to main: ghcr.io/<owner>/sudare:edge
# - Tags vX.Y.Z: ghcr.io/<owner>/sudare:X.Y.Z and :X.Y, plus a GitHub Release with the
#   Linux binary (UI embedded) and the standalone app as a static bundle, with checksums.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  assets:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.130
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run wasm
          npm run build
          npm run build:standalone
      - run: cargo build --release --locked -p sudare-cli
      - name: package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir out
          tar czf "out/sudare-$TAG-linux-x86_64.tar.gz" -C target/release sudare
          tar czf "out/sudare-standalone-$TAG.tar.gz" -C web/dist-standalone .
          (cd out && sha256sum * > SHA256SUMS)
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" out/* --generate-notes --verify-tag
